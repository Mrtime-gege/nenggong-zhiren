<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e13" />
    <title>能工智人 · 审计</title>
    <link rel="stylesheet" href="/console.css" />
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body data-page="audit">
    <header class="topbar">
      <div class="brand"><span class="status-dot ok"></span><span class="brand-name">能工智人</span><span class="brand-sub">管理后台</span></div>
      <nav id="topnav" class="topnav" aria-label="主导航"></nav>
      <div class="conn"><span id="userLabel" class="user-label">正在加载…</span><button id="logout" class="btn ghost" type="button">退出</button><span id="status" class="conn-status">连接中…</span></div>
    </header>
    <main class="admin-main">
      <div class="admin-head"><div><h1>审计</h1><p>登录、账号、密钥、设置和票据状态的最近操作记录。日志只追加，不保存密码或密钥明文。</p></div><a id="exportAudit" class="btn" href="/op/api/audit.csv" download="audit.csv">导出 CSV</a></div>
      <div class="admin-card">
        <form id="auditFilters" class="admin-form">
          <label class="field"><span class="field-label">操作者 <em class="opt">选填</em></span><input id="filterActor" type="text" placeholder="用户名" /></label>
          <label class="field"><span class="field-label">动作 <em class="opt">选填</em></span><input id="filterAction" type="text" placeholder="例如 login / key.create" /></label>
          <div class="form-actions"><button class="btn primary" type="submit">筛选</button><button id="auditReset" class="btn ghost" type="button">重置</button></div>
        </form>
      </div>
      <div class="admin-card">
        <div class="admin-card-title">事件列表 <span id="auditCount" class="admin-hint"></span></div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>IP</th><th>详情</th></tr></thead>
            <tbody id="auditTable"></tbody>
          </table>
        </div>
        <div id="auditEmpty" class="admin-empty hidden">还没有事件。</div>
      </div>
    </main>
    <script src="/navigation.js"></script>
    <script src="/admin-audit.js"></script>
  </body>
</html>
