<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b10" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>能工智人 · 管理后台</title>
    <link rel="stylesheet" href="/console.css" />
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body data-page="hub" data-hub>
    <header class="topbar">
      <div class="brand"><span class="brand-icon-wrap"><img class="brand-icon" src="/icon.svg" alt="" /><span class="status-dot ok"></span></span><span class="brand-name">能工智人</span><span class="brand-sub">管理后台</span></div>
      <nav id="topnav" class="topnav" aria-label="主导航"></nav>
      <div class="conn"><span id="userLabel" class="user-label">正在加载…</span><button id="logout" class="btn ghost" type="button">退出</button><span id="status" class="conn-status">连接中…</span></div>
    </header>

    <main class="admin-main hub-main">
      <div class="hub-breadcrumb" aria-label="菜单层级">
        <span class="hub-breadcrumb-level">一级菜单</span>
        <span id="hubParent" class="hub-breadcrumb-parent">概览</span>
        <span class="hub-breadcrumb-sep" aria-hidden="true">/</span>
        <strong id="hubCurrent">实时状态</strong>
      </div>
      <div class="hub-heading">
        <div>
          <span class="status-kicker">CONSOLE / HUB</span>
          <h1 id="hubTitle">概览</h1>
        </div>
      </div>
      <div class="hub-secondary">
        <span class="hub-tabs-kicker">二级菜单</span>
        <nav id="hubTabs" class="hub-tabs" aria-label="概览子页面"></nav>
      </div>
      <iframe id="hubFrame" class="hub-frame" title="管理子页面"></iframe>
    </main>
    <script src="/navigation.js"></script>
  </body>
</html>
