<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e13" />
    <title>能工智人 · 调用密钥</title>
    <link rel="stylesheet" href="/console.css" />
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body data-page="keys">
    <header class="topbar">
      <div class="brand">
        <span class="status-dot ok"></span>
        <span class="brand-name">能工智人</span>
        <span class="brand-sub">管理后台</span>
      </div>
      <nav id="topnav" class="topnav" aria-label="主导航"></nav>
      <div class="conn">
        <span id="userLabel" class="user-label">正在加载…</span>
        <button id="logout" class="btn ghost" type="button">退出</button>
        <span id="status" class="conn-status">连接中…</span>
      </div>
    </header>

    <main class="admin-main">
        <div class="admin-head">
          <div>
            <h1>调用密钥</h1>
            <p>创建、设置配额、停用和删除调用密钥。完整明文只在创建成功时显示一次。</p>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-title"><span id="keyFormTitle">生成新密钥</span></div>
          <form id="keyCreateForm" class="admin-form">
            <label class="field field-wide">
              <span class="field-label">密钥名称 <em class="req">必填</em></span>
              <input id="newKeyName" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="例如：演示站、内部工具" required />
            </label>
            <label id="keyValueField" class="field field-wide">
              <span class="field-label">自定义密钥 <em class="opt">选填</em></span>
              <input id="newKeyValue" type="text" minlength="12" maxlength="256" autocomplete="off" spellcheck="false" placeholder="留空自动生成；至少 12 位" />
            </label>
            <label class="field">
              <span class="field-label">每分钟请求 <em class="opt">选填</em></span>
              <input id="newKeyRpm" type="number" min="0" max="1000000" step="1" value="0" />
            </label>
            <label class="field">
              <span class="field-label">每日请求 <em class="opt">选填</em></span>
              <input id="newKeyPerDay" type="number" min="0" max="1000000" step="1" value="0" />
            </label>
            <label class="field">
              <span class="field-label">每月请求 <em class="opt">选填</em></span>
              <input id="newKeyPerMonth" type="number" min="0" max="1000000" step="1" value="0" />
            </label>
            <label class="field">
              <span class="field-label">并发上限 <em class="opt">选填</em></span>
              <input id="newKeyConcurrent" type="number" min="0" max="1000" step="1" value="0" />
            </label>
            <label class="field field-wide">
              <span class="field-label">允许模型 <em class="opt">选填</em></span>
              <div id="newKeyModelPicker" class="model-picker" role="group" aria-label="允许模型"></div>
              <input id="newKeyCustomModels" type="text" autocomplete="off" spellcheck="false" placeholder="其他模型（可选，逗号分隔）" />
              <span id="newKeyModelHint" class="admin-hint">全部模型 = 不限制；可以保存常用模型组合。</span>
            </label>
            <label class="field field-wide">
              <span class="field-label">有效期 <em class="opt">选填</em></span>
              <div class="expiry-controls">
                <select id="newKeyExpiryPreset">
                  <option value="never">永不过期</option>
                  <option value="1">1 天后</option>
                  <option value="7">7 天后</option>
                  <option value="30">30 天后</option>
                  <option value="90">90 天后</option>
                  <option value="custom">自定义时间</option>
                </select>
                <input id="newKeyExpires" type="datetime-local" disabled />
              </div>
              <span id="newKeyExpiryHint" class="admin-hint">永不过期：密钥一直有效，直到手动停用或删除。</span>
            </label>
            <div class="form-actions">
              <button id="keyCreateBtn" class="btn primary" type="submit">生成新密钥</button>
              <button id="keyCancelBtn" class="btn ghost hidden" type="button">取消编辑</button>
              <span class="admin-hint">0 表示不限制；自定义密钥需为 12–256 位安全字符。</span>
            </div>
          </form>
          <div id="keysError" class="form-error" role="alert"></div>
          <div id="newKeyBox" class="new-key-box hidden">
            <div class="new-key-label">新密钥（只显示这一次）</div>
            <div class="new-key-row">
              <code id="newKeyValueDisplay"></code>
              <button id="copyKeyBtn" class="btn ghost" type="button">复制</button>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-title">密钥列表 <span id="keyCount" class="admin-hint"></span></div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>名称</th>
                  <th>密钥提示</th>
                  <th>状态</th>
                  <th>有效期</th>
                  <th>配额</th>
                  <th>模型</th>
                  <th>创建 / 最近使用</th>
                  <th>已用</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="keyTable"></tbody>
            </table>
          </div>
          <div id="keysEmpty" class="admin-empty hidden">还没有调用密钥。</div>
          <p class="admin-hint">停用后调用方立即收到 401；删除不可恢复。配额按 UTC 的分钟、日、月统计。</p>
        </div>
    </main>
    <script src="/navigation.js"></script>
    <script src="/admin-keys.js"></script>
  </body>
</html>
