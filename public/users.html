<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e13" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>能工智人 · 用户管理</title>
    <link rel="stylesheet" href="/console.css" />
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body data-page="users">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon-wrap"><img class="brand-icon" src="/icon.svg" alt="" /><span class="status-dot ok"></span></span>
        <span class="brand-name">能工智人</span>
        <span class="brand-sub">管理后台</span>
      </div>
      <nav id="topnav" class="topnav" aria-label="主导航"></nav>
      <div class="conn">
        <span id="userLabel" class="user-label">正在加载…</span>
        <button id="logout" class="btn ghost" type="button">退出</button>
        <span id="status" class="conn-status">连接中…</span>
      </div>
    </header>

    <main class="admin-main">
        <div class="admin-head">
          <div>
            <h1>用户管理</h1>
            <p>创建回复员和管理员、修改角色、重置密码。密码只保存哈希。</p>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-title"><span id="userFormTitle">添加用户</span></div>
          <form id="userCreateForm" class="admin-form">
            <label class="field">
              <span class="field-label">用户名 <em class="req">必填</em></span>
              <input id="newUsername" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="3–32 位小写字母/数字/._-" required />
            </label>
            <label class="field">
              <span class="field-label">密码 <em id="passwordFlag" class="req">必填</em></span>
              <input id="newPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" placeholder="至少 8 位" required />
            </label>
            <label class="field">
              <span class="field-label">角色 <em class="req">必填</em></span>
              <select id="newRole" required>
                <option value="operator">人工回复员</option>
                <option value="admin">管理员</option>
              </select>
            </label>
            <div class="field field-full">
              <span class="field-label">可回复模型 <em class="opt">选填</em></span>
              <div id="userModelPicker" class="model-picker" role="group" aria-label="可回复模型"></div>
              <span id="userModelHint" class="admin-hint">全部模型 = 不限制；无权限的票据不会出现在该用户队列中。</span>
            </div>
            <div class="field field-full">
              <span class="field-label">功能权限 <em class="opt">按账号</em></span>
              <div id="userFeaturePicker" class="feature-picker" role="group" aria-label="用户功能权限"></div>
              <span id="userFeatureHint" class="admin-hint">关闭后该账号看不到对应功能；管理员始终可以修改这些开关。</span>
            </div>
            <div class="form-actions">
              <button id="userCreateBtn" class="btn primary" type="submit">添加用户</button>
              <button id="userCancelBtn" class="btn ghost hidden" type="button">取消编辑</button>
            </div>
          </form>
          <div id="usersError" class="form-error" role="alert"></div>
        </div>

        <div class="admin-card">
          <div class="admin-card-title">用户列表 <span id="userCount" class="admin-hint"></span></div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>用户</th>
                  <th>角色</th>
                  <th>可回复模型</th>
                  <th>功能</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userTable"></tbody>
            </table>
          </div>
          <div id="usersEmpty" class="admin-empty hidden">还没有用户。</div>
          <p class="admin-hint">不能删除自己，也不能删除最后一个管理员；修改自己的密码后需要重新登录。</p>
        </div>
    </main>
    <script src="/navigation.js"></script>
    <script src="/password-strength.js"></script>
    <script src="/admin-users.js"></script>
  </body>
</html>
